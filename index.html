<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K Gardai HO — Bhatta ji</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0;padding:0;box-sizing:border-box; }
  :root {
    --gold:#f5c842; --deep:#0a0a1a; --rose:#ff4d88;
    --cyan:#00f5d4; --purple:#7b2fff; --mint:#a8ffce;
  }
  html,body { width:100%;height:100%;background:var(--deep);overflow:hidden;font-family:'Yatra One',cursive; }

  /* ── Stars ── */
  .stars { position:fixed;inset:0;z-index:0; }
  .star { position:absolute;border-radius:50%;background:white;animation:twinkle var(--dur,3s) infinite alternate ease-in-out;opacity:0; }
  @keyframes twinkle { from{opacity:0;transform:scale(.5)} to{opacity:var(--op,.8);transform:scale(1.2)} }

  /* ── Orbs ── */
  .orbs { position:fixed;inset:0;z-index:0;overflow:hidden; }
  .orb { position:absolute;border-radius:50%;filter:blur(80px);animation:drift var(--d,12s) infinite ease-in-out alternate;opacity:.25; }
  .orb:nth-child(1){width:500px;height:500px;background:var(--rose);left:-100px;top:-100px;--d:14s}
  .orb:nth-child(2){width:400px;height:400px;background:var(--purple);right:-100px;bottom:-100px;--d:11s}
  .orb:nth-child(3){width:300px;height:300px;background:var(--cyan);left:40%;top:30%;--d:9s}
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(60px,40px) scale(1.15)} }

  /* ── Glow line ── */
  .glow-line { position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--cyan),var(--purple),var(--rose));background-size:300%;animation:slideGlow 3s linear infinite; }
  @keyframes slideGlow { 0%{background-position:0%} 100%{background-position:300%} }

  /* ── Init particles ── */
  .particles { position:fixed;inset:0;pointer-events:none;z-index:20; }
  .p { position:absolute;border-radius:50%;width:var(--s,6px);height:var(--s,6px);background:var(--c,white);left:50%;top:50%;opacity:0;animation:burst 1.4s ease-out forwards var(--delay,1.5s); }
  @keyframes burst { 0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0)} }

  /* ── Music toggle button ── */
  #musicBtn {
    position:fixed;top:16px;right:16px;z-index:100;
    background:rgba(255,255,255,.08);
    border:1.5px solid rgba(245,200,66,.4);
    border-radius:50px;padding:.45rem 1rem;
    color:var(--gold);font-size:.85rem;cursor:pointer;
    font-family:'Yatra One',cursive;letter-spacing:.04em;
    backdrop-filter:blur(8px);
    transition:background .3s,transform .2s,box-shadow .3s;
    display:flex;align-items:center;gap:.4rem;
  }
  #musicBtn:hover{background:rgba(245,200,66,.15);transform:scale(1.06);box-shadow:0 0 18px rgba(245,200,66,.3)}
  #musicBtn .note { display:inline-block; animation:noteBounce 0.5s ease-in-out infinite alternate; }
  @keyframes noteBounce { from{transform:translateY(0)} to{transform:translateY(-4px)} }
  #musicBtn.playing .note { animation:noteBounce 0.3s ease-in-out infinite alternate; }

  /* ── Volume bar visualizer ── */
  .viz {
    position:fixed;bottom:6px;left:50%;transform:translateX(-50%);
    display:flex;align-items:flex-end;gap:3px;height:22px;z-index:50;
    opacity:0;transition:opacity .4s;
  }
  .viz.on { opacity:1; }
  .vbar {
    width:4px;border-radius:2px;
    background:linear-gradient(to top,var(--rose),var(--gold));
    animation:vibanim var(--vd,.4s) ease-in-out infinite alternate;
    height:var(--vh,10px);
  }
  @keyframes vibanim { from{transform:scaleY(.3)} to{transform:scaleY(1)} }

  /* ══════════════ SCREEN 1 ══════════════ */
  #screen1 { position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;transition:opacity .8s,transform .8s; }
  #screen1.exit { opacity:0;transform:scale(1.15);pointer-events:none; }

  .stage { position:relative;text-align:center;padding:2.5rem 3rem; }

  .ring { position:absolute;inset:-60px;border-radius:50%;border:1.5px solid transparent;background:conic-gradient(from 0deg,var(--rose),var(--gold),var(--cyan),var(--purple),var(--rose)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:spin 8s linear infinite;opacity:0;animation-delay:1.8s;animation-fill-mode:forwards; }
  .ring-2 { inset:-100px;animation-direction:reverse;animation-duration:14s;border-width:1px;animation-delay:2s; }
  @keyframes spin { 0%{transform:rotate(0deg);opacity:.5} 100%{transform:rotate(360deg);opacity:.5} }

  .question { font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:clamp(1.2rem,3vw,1.8rem);color:var(--cyan);letter-spacing:.08em;opacity:0;animation:slideDown .8s ease forwards .3s;margin-bottom:1rem;text-shadow:0 0 20px var(--cyan); }
  .main-text { display:block;font-family:'Yatra One',cursive;font-size:clamp(3rem,9vw,7rem);line-height:1;background:linear-gradient(135deg,var(--gold) 0%,var(--rose) 40%,var(--cyan) 80%,var(--gold) 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradShift 4s ease infinite,riseUp 1s cubic-bezier(.22,1,.36,1) forwards .6s;opacity:0;filter:drop-shadow(0 0 30px rgba(245,200,66,.4)); }
  .name-line { display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1.4rem;opacity:0;animation:fadeScale .9s ease forwards 1.2s; }
  .dash { display:block;width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:expandW 1s ease forwards 1.6s;transform:scaleX(0); }
  .name { font-family:'Yatra One',cursive;font-size:clamp(1.6rem,4vw,2.8rem);color:var(--gold);letter-spacing:.05em;text-shadow:0 0 40px rgba(245,200,66,.6),0 0 80px rgba(245,200,66,.3);animation:namePulse 2.5s ease-in-out infinite 2s; }
  .ji { font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(1.1rem,2.5vw,1.6rem);color:var(--rose);font-style:italic;text-shadow:0 0 20px var(--rose); }

  .sparkles { margin-top:1.2rem;display:flex;justify-content:center;gap:.6rem;opacity:0;animation:fadeIn 1s ease forwards 2s; }
  .sparkle-dot { width:8px;height:8px;border-radius:50%;animation:dotPop 1.5s ease-in-out infinite var(--sd,0s); }
  .sparkle-dot:nth-child(1){background:var(--rose);--sd:0s}
  .sparkle-dot:nth-child(2){background:var(--gold);--sd:.2s}
  .sparkle-dot:nth-child(3){background:var(--cyan);--sd:.4s}
  .sparkle-dot:nth-child(4){background:var(--purple);--sd:.6s}
  .sparkle-dot:nth-child(5){background:var(--rose);--sd:.8s}
  @keyframes dotPop { 0%,100%{transform:scale(1) translateY(0)} 50%{transform:scale(1.6) translateY(-6px)} }

  /* ── Answer box ── */
  .answer-wrap { margin-top:2rem;opacity:0;animation:slideUp .9s ease forwards 2.3s;display:flex;flex-direction:column;align-items:center;gap:.8rem; }
  @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  .answer-label { font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:clamp(.85rem,2vw,1rem);color:rgba(255,255,255,.5);letter-spacing:.05em; }
  .input-row { display:flex;gap:.7rem;align-items:stretch;flex-wrap:wrap;justify-content:center; }
  .answer-input {
    background:rgba(255,255,255,.05);border:1.5px solid rgba(245,200,66,.3);border-radius:14px;padding:.7rem 1.2rem;
    color:#fff;font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(.95rem,2.5vw,1.1rem);
    width:clamp(180px,38vw,300px);outline:none;transition:border-color .3s,box-shadow .3s,background .3s;caret-color:var(--gold);
  }
  .answer-input::placeholder{color:rgba(255,255,255,.28)}
  .answer-input:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(245,200,66,.3),0 0 40px rgba(245,200,66,.1);background:rgba(255,255,255,.09)}
  .send-btn {
    position:relative;overflow:hidden;background:linear-gradient(135deg,var(--rose),var(--purple));
    border:none;border-radius:14px;padding:.7rem 1.5rem;color:#fff;font-family:'Yatra One',cursive;
    font-size:clamp(.85rem,2vw,1rem);cursor:pointer;letter-spacing:.04em;
    transition:transform .2s,box-shadow .3s;box-shadow:0 4px 24px rgba(255,77,136,.3);white-space:nowrap;
  }
  .send-btn:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 8px 32px rgba(255,77,136,.55)}
  .send-btn:active{transform:scale(.97)}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .6s linear forwards;pointer-events:none;}
  @keyframes ripple{to{transform:scale(4);opacity:0}}

  /* ══════════════ SCREEN 2 ══════════════ */
  #screen2 { position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s; }
  #screen2.active{opacity:1;pointer-events:all}
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;}
  .aurora-band{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:conic-gradient(from 0deg at 50% 50%,rgba(0,245,212,.2),rgba(123,47,255,.24),rgba(255,77,136,.2),rgba(168,255,206,.15),rgba(0,245,212,.2));animation:auroraSpin 16s linear infinite;opacity:0;transition:opacity 1.2s;}
  #screen2.active .aurora-band{opacity:1}
  @keyframes auroraSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .s2-eyebrow{font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:clamp(.9rem,2.5vw,1.3rem);color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:.5rem;opacity:0;transform:translateY(-20px);transition:opacity .7s .3s,transform .7s .3s;}
  #screen2.active .s2-eyebrow{opacity:1;transform:translateY(0)}
  .s2-main{font-family:'Yatra One',cursive;font-size:clamp(2.2rem,8vw,5.5rem);line-height:1.1;text-align:center;}
  .s2-char{display:inline-block;opacity:0;transform:translateY(50px) scale(.6);transition:opacity .45s,transform .45s;background:linear-gradient(135deg,var(--mint),var(--cyan) 50%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 14px rgba(168,255,206,.6));}
  #screen2.active .s2-char{opacity:1;transform:translateY(0) scale(1)}
  .s2-divider{width:0;height:2px;margin-top:1.2rem;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),var(--rose),transparent);border-radius:2px;transition:width 1s 1.4s ease;box-shadow:0 0 12px var(--cyan);}
  #screen2.active .s2-divider{width:min(300px,70vw)}
  .s2-sub{font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:clamp(1rem,2.8vw,1.6rem);color:var(--rose);margin-top:.9rem;letter-spacing:.06em;text-shadow:0 0 20px var(--rose),0 0 50px rgba(255,77,136,.4);opacity:0;transform:scale(.8);transition:opacity .8s 2s,transform .8s 2s;}
  #screen2.active .s2-sub{opacity:1;transform:scale(1)}
  .s2-echo{margin-top:.9rem;font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:clamp(.8rem,2vw,1rem);color:rgba(255,255,255,.42);opacity:0;transition:opacity 1s 2.8s;max-width:360px;text-align:center;line-height:1.5;}
  #screen2.active .s2-echo{opacity:1}
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:30;}
  .floater{position:absolute;font-size:var(--fs,1.8rem);bottom:-60px;left:var(--lft,50%);opacity:0;animation:floatUp var(--du,4s) ease-out forwards var(--dl,0s);}
  @keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5) rotate(0deg)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translateY(-110vh) scale(1.2) rotate(var(--rot,20deg))}}
  .s2-burst{position:fixed;inset:0;pointer-events:none;z-index:25;}
  .sb{position:absolute;width:var(--sw,3px);height:var(--sw,3px);border-radius:50%;background:var(--sc,white);left:var(--sleft);top:var(--stop);opacity:0;animation:sbAnim var(--sdu,1.2s) ease-out forwards var(--sdl,0s);}
  @keyframes sbAnim{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--stx),var(--sty)) scale(0)}}

  /* Shared */
  @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes riseUp{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeScale{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  @keyframes expandW{to{transform:scaleX(1)}}
  @keyframes namePulse{0%,100%{text-shadow:0 0 40px rgba(245,200,66,.6),0 0 80px rgba(245,200,66,.3)}50%{text-shadow:0 0 60px rgba(245,200,66,1),0 0 120px rgba(245,200,66,.5)}}
  @keyframes fadeIn{to{opacity:1}}
</style>
</head>
<body>

<!-- Music Toggle -->
<button id="musicBtn" title="Toggle Music">
  <span class="note">🎵</span> <span id="musicLabel">Play Music</span>
</button>

<!-- Visualizer -->
<div class="viz" id="viz"></div>

<!-- Shared BG -->
<div class="stars" id="stars"></div>
<div class="orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="glow-line"></div>
<div class="particles" id="particles"></div>

<!-- ══════ SCREEN 1 ══════ -->
<div id="screen1">
  <div class="stage">
    <div class="ring"></div>
    <div class="ring ring-2"></div>
    <p class="question">के गर्दै छौ ...</p>
    <span class="main-text">K Gardai Chhau?</span>
    <div class="name-line">
      <span class="dash"></span>
      <span class="name">Treepti Bhatt</span>
      <span class="ji">ji ??</span>
      <span class="dash"></span>
    </div>
    <div class="sparkles">
      <div class="sparkle-dot"></div><div class="sparkle-dot"></div>
      <div class="sparkle-dot"></div><div class="sparkle-dot"></div>
      <div class="sparkle-dot"></div>
    </div>
    <div class="answer-wrap">
      <p class="answer-label">✨ आफ्नो जवाफ यहाँ लेख्नुस् ...</p>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text"
          placeholder="Khabar sunau malaai..." maxlength="100" autocomplete="off"/>
        <button class="send-btn" id="sendBtn">भन्नुस् 💬</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════ SCREEN 2 ══════ -->
<div id="screen2">
  <div class="aurora"><div class="aurora-band"></div></div>
  <p class="s2-eyebrow">वाह! अब बताउनुस् —</p>
  <div class="s2-main" id="s2Main"></div>
  <div class="s2-divider"></div>
  <p class="s2-sub">Treepti ji 🌸✨</p>
  <p class="s2-echo" id="s2Echo"></p>
  <div class="floaters" id="floaters"></div>
  <div class="s2-burst" id="s2Burst"></div>
</div>

<script>
/* ══════════════════════════════════════════
   🎵 WEB AUDIO ENGINE — Meme Music
══════════════════════════════════════════ */
let audioCtx = null;
let masterGain = null;
let bgmNodes = [];
let isPlaying = false;
let bgmScheduler = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.28, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);
}

/* ── helpers ── */
function osc(type, freq, startT, dur, gainVal=0.3, detune=0) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, startT);
  o.detune.setValueAtTime(detune, startT);
  g.gain.setValueAtTime(0, startT);
  g.gain.linearRampToValueAtTime(gainVal, startT + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, startT + dur);
  o.connect(g); g.connect(masterGain);
  o.start(startT); o.stop(startT + dur + 0.05);
  return o;
}

function noise(startT, dur, gainVal=0.08, bpFreq=800) {
  const bufLen = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0; i<bufLen; i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = bpFreq; bp.Q.value = 1.5;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gainVal, startT);
  g.gain.exponentialRampToValueAtTime(0.001, startT+dur);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(startT); src.stop(startT+dur+0.05);
}

/* ── Meme notes: quirky pentatonic + chromatic intervals ── */
// "Coffin Dance" but funky and silly — Ding dong style
const BPM = 128;
const BEAT = 60 / BPM;

// Meme melody — recognizable funny "dun dun dun" + silly beeps
// Using a fun mix: staccato beeps, wobbly bass, cartoon hits
const MELODY = [
  // bar 1 — "ta da da" intro fanfare
  [523,0], [659,0.5], [784,1.0], [1047,1.5],
  [784,2.0], [659,2.25], [523,2.5],
  // bar 2 — silly descending
  [880,3.0],[831,3.25],[784,3.5],[698,3.75],
  [659,4.0],[587,4.25],[523,4.5],[494,4.75],
  // bar 3 — "dun dun dun" meme hit
  [262,5.0],[262,5.15],[262,5.3],
  [330,5.6],[262,5.8],[330,6.0],[392,6.25],
  // bar 4 — bouncy going up
  [523,7.0],[587,7.25],[659,7.5],[698,7.75],
  [784,8.0],[880,8.25],[988,8.5],[1047,8.75],
];

const BASS = [
  [130,0],[165,1],[196,2],[130,3],
  [110,4],[130,5],[98,6],[130,7],
];

function playMeme() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const loop = 9 * BEAT; // loop every 9 beats worth
  let startT = audioCtx.currentTime + 0.05;

  function scheduleLoop(baseT) {
    // Melody — square wave beeps (fun & meme-like)
    MELODY.forEach(([freq, offset]) => {
      const t = baseT + offset * BEAT * 0.5;
      osc('square', freq, t, BEAT*0.22, 0.12);
      osc('sine',   freq, t, BEAT*0.22, 0.08, -5);
    });

    // Bass — punchy sine
    BASS.forEach(([freq, offset]) => {
      const t = baseT + offset * BEAT * 0.5;
      osc('sine', freq, t, BEAT*0.35, 0.25);
      osc('triangle', freq*2, t, BEAT*0.15, 0.08);
    });

    // Kick drum (low thud)
    for (let i=0; i<8; i++) {
      const t = baseT + i * BEAT * 0.5;
      const ko = audioCtx.createOscillator();
      const kg = audioCtx.createGain();
      ko.frequency.setValueAtTime(160, t);
      ko.frequency.exponentialRampToValueAtTime(40, t+0.15);
      kg.gain.setValueAtTime(0.5, t);
      kg.gain.exponentialRampToValueAtTime(0.001, t+0.2);
      ko.connect(kg); kg.connect(masterGain);
      ko.start(t); ko.stop(t+0.22);
    }

    // Hi-hat noise on off-beats
    for (let i=0; i<16; i++) {
      if (i%2===1) noise(baseT + i * BEAT * 0.25, 0.06, 0.04, 6000+Math.random()*2000);
    }

    // Funny "boing" sfx every 4 beats
    for (let i=0; i<2; i++) {
      const t = baseT + i * BEAT * 2;
      const bo = audioCtx.createOscillator();
      const bg2 = audioCtx.createGain();
      bo.type = 'sine';
      bo.frequency.setValueAtTime(100+Math.random()*50, t);
      bo.frequency.exponentialRampToValueAtTime(600+Math.random()*200, t+0.2);
      bg2.gain.setValueAtTime(0.18, t);
      bg2.gain.exponentialRampToValueAtTime(0.001, t+0.25);
      bo.connect(bg2); bg2.connect(masterGain);
      bo.start(t); bo.stop(t+0.3);
    }

    // Schedule next loop
    bgmScheduler = setTimeout(() => scheduleLoop(baseT + loop), (loop - 0.3) * 1000);
  }

  scheduleLoop(startT);
  isPlaying = true;
  updateMusicUI();
  document.getElementById('viz').classList.add('on');
}

function stopMeme() {
  clearTimeout(bgmScheduler);
  if (masterGain) {
    masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
    setTimeout(() => {
      masterGain.gain.setValueAtTime(0.28, audioCtx.currentTime);
    }, 600);
  }
  isPlaying = false;
  updateMusicUI();
  document.getElementById('viz').classList.remove('on');
}

function updateMusicUI() {
  const btn = document.getElementById('musicBtn');
  document.getElementById('musicLabel').textContent = isPlaying ? 'Mute 🔇' : 'Play Music';
  btn.classList.toggle('playing', isPlaying);
}

/* ── Funny sound effects ── */
function sfxWhoosh() {
  initAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(800, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.4);
  g.gain.setValueAtTime(0.18, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
  o.connect(g); g.connect(masterGain || audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.45);
}

function sfxTaDa() {
  initAudio();
  const now = audioCtx.currentTime;
  // Quick fanfare
  [[523,0],[659,.08],[784,.16],[1047,.24],[1319,.36]].forEach(([f,t]) => {
    osc('square', f, now+t, 0.18, 0.13);
    osc('sine',   f, now+t, 0.25, 0.10);
  });
  // Big final chord
  [523,659,784,1047].forEach(f => osc('sine', f, now+0.55, 0.5, 0.10));
  // cymbal crash
  noise(now+0.55, 0.4, 0.12, 5000);
}

function sfxBoing() {
  initAudio();
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(80, now);
  o.frequency.exponentialRampToValueAtTime(900, now+0.3);
  o.frequency.exponentialRampToValueAtTime(400, now+0.6);
  g.gain.setValueAtTime(0.25, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.65);
  o.connect(g); g.connect(masterGain || audioCtx.destination);
  o.start(now); o.stop(now+0.7);
}

/* ── Music button ── */
document.getElementById('musicBtn').addEventListener('click', () => {
  if (isPlaying) { stopMeme(); }
  else { playMeme(); }
});

/* ══════════════════════════════════════════
   Stars
══════════════════════════════════════════ */
const starsEl = document.getElementById('stars');
for (let i=0; i<140; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random()*2.5+.5;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--op:${.3+Math.random()*.7};animation-delay:${Math.random()*4}s;`;

/* Initial particles */
const colors = ['#f5c842','#ff4d88','#00f5d4','#7b2fff','#fff'];
const pEl = document.getElementById('particles');
for (let i=0; i<60; i++) {
  const p = document.createElement('div');
  p.className = 'p';
  const angle = (i/60)*Math.PI*2;
  const dist = 80+Math.random()*220;
  p.style.cssText = `--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--c:${colors[i%5]};--s:${4+Math.random()*8}px;--delay:${1.2+Math.random()*.4}s;`;
  pEl.appendChild(p);
}

/* Ripple */
const sendBtn = document.getElementById('sendBtn');
sendBtn.addEventListener('click', function(e) {
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = this.getBoundingClientRect();
  const sz = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px;`;
  this.appendChild(r);
  setTimeout(() => r.remove(), 700);
  sfxWhoosh();
  doTransition();
});

document.getElementById('answerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { sfxWhoosh(); doTransition(); }
});

/* ── Transition ── */
function doTransition() {
  const val = document.getElementById('answerInput').value.trim();

  const phrase = 'अरु सुनाउ खबर';
  const s2Main = document.getElementById('s2Main');
  s2Main.innerHTML = '';
  [...phrase].forEach(ch => {
    if (ch===' ') { s2Main.appendChild(document.createTextNode('\u00a0\u00a0')); return; }
    const span = document.createElement('span');
    span.className = 's2-char'; span.textContent = ch;
    s2Main.appendChild(span);
  });

  document.getElementById('s2Echo').textContent = val
    ? `"${val}" — सुनेर खुसी लाग्यो 🌺`
    : 'धेरै कुरा सुन्न मन छ तिमीबाट 🌸';

  document.getElementById('screen1').classList.add('exit');

  setTimeout(() => {
    document.getElementById('screen1').style.display = 'none';
    const s2 = document.getElementById('screen2');
    s2.classList.add('active');

    document.querySelectorAll('.s2-char').forEach((ch, i) => {
      ch.style.transitionDelay = `${0.35 + i * 0.08}s`;
    });

    // 🎵 Ta-da sound + switch to party music feel
    sfxTaDa();
    setTimeout(sfxBoing, 600);

    launchFloaters();
    launchBurst();
  }, 700);
}

function launchFloaters() {
  const el = document.getElementById('floaters');
  el.innerHTML = '';
  const emojis = ['🌸','💫','✨','🌺','💕','🎶','🌟','💐','🦋','🌈','🎉','💖','🎊','🥳','🎵'];
  for (let i=0; i<28; i++) {
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    f.style.cssText = `--lft:${5+Math.random()*90}%;--fs:${1.2+Math.random()*2}rem;--du:${3+Math.random()*4}s;--dl:${Math.random()*5}s;--rot:${-30+Math.random()*60}deg;`;
    el.appendChild(f);
  }
}

function launchBurst() {
  const el = document.getElementById('s2Burst');
  el.innerHTML = '';
  const bc = ['#a8ffce','#f5c842','#ff4d88','#00f5d4','#fff','#7b2fff'];
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  for (let i=0; i<90; i++) {
    const b = document.createElement('div');
    b.className = 'sb';
    const angle = Math.random()*Math.PI*2;
    const dist = 80+Math.random()*320;
    b.style.cssText = `--sleft:${cx}px;--stop:${cy}px;--sc:${bc[i%bc.length]};--sw:${3+Math.random()*8}px;--stx:${Math.cos(angle)*dist}px;--sty:${Math.sin(angle)*dist}px;--sdu:${.7+Math.random()*.9}s;--sdl:${.05+Math.random()*.7}s;`;
    el.appendChild(b);
  }
}
